name: xfee-local

services:
  xfee-database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  xfee-wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      xfee-database:
        condition: service_healthy
    ports:
      - '8080:80'
    environment:
      WORDPRESS_DB_HOST: xfee-database:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: '1'
    volumes:
      - wordpress_data:/var/www/html
      - ../xfee_theme:/var/www/html/wp-content/themes/xfee_theme
      - ../authentik-integration/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

volumes:
  db_data:
  wordpress_data:
